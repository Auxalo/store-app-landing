name: Docker image

# Builds the production image on GitHub (not on the server) and publishes it to GitHub's container
# registry. Your host (Dokploy, a VPS, ...) then pulls ghcr.io/auxalo/trade-hishab-landing:latest.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            SUPPORT_WHATSAPP=${{ vars.SUPPORT_WHATSAPP }}
            SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell the host to redeploy (optional)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"
          else
            echo "DEPLOY_WEBHOOK_URL is not set; deploy from your host's panel."
          fi
